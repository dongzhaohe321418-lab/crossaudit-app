name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.10'}
          - {os: macos-latest, python: '3.13'}
          - {os: windows-latest, python: '3.10'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: git config --global user.name CrossAudit-CI
      - run: git config --global user.email crossaudit-ci@local.invalid
      - run: python -m pip install --upgrade pip
      # Install a real wheel. Editable installs can succeed while their .pth
      # file is ignored by the interpreter, and are not what users receive.
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q --timeout=30

  quality:
    env:
      PYTHONUTF8: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Reject syntax, undefined names, and invalid control flow
        run: python -m ruff check --select E9,F63,F7,F82 src tests
      - run: python -m compileall -q src tests
      - name: Measure branch coverage and enforce the baseline
        run: |
          python -m coverage run -m pytest -q --timeout=30
          python -m coverage report

  package:
    env:
      PYTHONUTF8: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - name: Inspect and install the actual wheel in a fresh environment
        run: python packaging/verify_python_package.py dist/*.whl --expected-version "$(PYTHONPATH=src python -c 'import crossaudit;print(crossaudit.__version__)')"
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/*

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install .
      - name: Audit the installed runtime dependency graph
        run: |
          python -m pip freeze | grep -viE '^crossaudit([=@ ]|$)' > audit-requirements.txt
          python -m pip_audit --strict -r audit-requirements.txt
