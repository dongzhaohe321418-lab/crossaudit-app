name: Live provider compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    env:
      CROSSAUDIT_AUDITOR_KEY: ${{ secrets.CROSSAUDIT_LIVE_OPENAI_KEY }}
      CROSSAUDIT_GENERATOR_KEY: ${{ secrets.CROSSAUDIT_LIVE_ANTHROPIC_KEY }}
      CROSSAUDIT_LIVE_OPENAI_MODEL: ${{ vars.CROSSAUDIT_LIVE_OPENAI_MODEL }}
      CROSSAUDIT_LIVE_ANTHROPIC_MODEL: ${{ vars.CROSSAUDIT_LIVE_ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install ".[dev]"
      - name: Check configured live credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CROSSAUDIT_AUDITOR_KEY" && -n "$CROSSAUDIT_GENERATOR_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Live provider secrets are not configured; compatibility call skipped."
          fi
      - name: Run real OpenAI and Anthropic calls
        if: steps.credentials.outputs.available == 'true'
        env:
          CROSSAUDIT_LIVE_E2E: '1'
        run: python -m pytest -q --timeout=120 tests/test_live_providers.py
